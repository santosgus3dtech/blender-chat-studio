[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blender-chat-studio"
version = "0.1.0"
description = "Portfolio-safe Blender MCP core with isolated workers and reproducible 3D examples"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.15.7"]

[project.scripts]
blender-studio = "studio.cli:main"
blender-studio-mcp = "studio.mcp_bridge:main"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
